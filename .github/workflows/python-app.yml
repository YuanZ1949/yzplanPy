name: Python application

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: [ "3.11" ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest

  build:
    name: Build Windows app (PyInstaller onedir)
    runs-on: windows-latest
    needs: test
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create .venv and install dependencies (mirrors build.bat)
        shell: pwsh
        run: |
          python -m venv .venv
          .\.venv\Scripts\python.exe -m pip install --upgrade pip
          .\.venv\Scripts\python.exe -m pip install -r requirements.txt

      - name: Build with PyInstaller
        shell: pwsh
        run: |
          $env:PYTHONHOME = ""
          $env:PYTHONPATH = ""
          .\.venv\Scripts\python.exe -m PyInstaller --noconfirm yzplan.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: YZplan-windows-x64
          path: dist/YZplan/
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    runs-on: windows-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: YZplan-windows-x64
          path: YZplan-artifact

      - name: Zip the build
        shell: pwsh
        run: |
          Compress-Archive -Path .\YZplan-artifact\* -DestinationPath .\YZplan-${{ github.ref_name }}.zip -Force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: YZplan-${{ github.ref_name }}.zip